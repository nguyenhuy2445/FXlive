<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BVBank FX Live Quotes</title>
    <style>
      /* Thiết lập nền toàn trang */
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        font-family: Arial, sans-serif;
        zoom: 3.7;
      }

      /* Container bao quanh tất cả các widget */
      .main-wrapper {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 5px;

        padding: 10px;
      }

      tv-tickers {
        display: block;
        min-width: 0;
        height: 340px;
        align-self: center;
      }

      .floating-footer {
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 10;
        padding: 10px 14px;
        background: black;
        color: #fff;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <script
        type="module"
        src="https://widgets.tradingview-widget.com/w/en/tv-tickers.js"
      ></script>

      <tv-tickers
        symbols="FX:EURUSD, FX:AUDUSD"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols="FX:USDJPY, FX:USDCAD"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols="FX:GBPUSD, , CAPITALCOM:DXY"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols=" OANDA:XAUUSD, SKILLING:BRENT"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
    </div>
  </body>
</html>
