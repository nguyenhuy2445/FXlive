<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BVBank FX Live Quotes</title>
    <style>
      /* Thiết lập nền toàn trang */
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        font-family: Arial, sans-serif;
        display: grid;
        place-items: center;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      /* Container bao quanh tất cả các widget */
      .main-wrapper {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: minmax(0, 1fr);
        gap: clamp(4px, 0.6vw, 12px);
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        padding: clamp(2px, 0.8vw, 2px);
      }

      tv-tickers {
        display: block;
        width: 100%;
        height: 110%;
        min-width: 0;
        min-height: 0;
        align-self: stretch;
        padding: 0;
        zoom: 3.7;
      }

      .floating-footer {
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 10;
        padding: 10px 14px;
        background: black;
        color: #fff;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <script
        type="module"
        src="https://widgets.tradingview-widget.com/w/en/tv-tickers.js"
      ></script>

      <tv-tickers
        symbols="FX:EURUSD, FX:USDJPY, OANDA:XAGUSD"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols="FX:AUDUSD, FX:USDCAD, OANDA:XAUUSD"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>

      <tv-tickers
        symbols="FX:GBPUSD, CAPITALCOM:DXY, SKILLING:BRENT"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
    </div>
  </body>
</html>
