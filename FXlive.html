<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BVBank FX Live Quotes</title>
    <style>
      /* Thiết lập nền toàn trang */
      body {
        margin: 0;
        padding: 0;
        background-color: black;
        font-family: Arial, sans-serif;
      }

      /* Container bao quanh tất cả các widget */
      .main-wrapper {
        box-sizing: border-box;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 5px;
        min-height: 100vh;
        padding: 10px;
      }

      tv-tickers {
        display: block;
        min-width: 0;
        align-self: center;
      }
    </style>
  </head>
  <body>
    <div class="main-wrapper">
      <script
        type="module"
        src="https://widgets.tradingview-widget.com/w/en/tv-tickers.js"
      ></script>

      <tv-tickers
        symbols="FX:EURUSD, FX:AUDUSD, FX:GBPUSD"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols="FX:USDJPY, FX:USDCAD, CAPITALCOM:DXY"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
      <tv-tickers
        symbols="OANDA:XAGUSD, OANDA:XAUUSD, SKILLING:BRENT"
        hide-chart
        theme="dark"
        transparent
        direction="vertical"
      ></tv-tickers>
    </div>
  </body>
</html>
